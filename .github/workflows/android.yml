env:
  ORG_GRADLE_PROJECT_maxParallelForks: 1
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx512m
name: Auto Reorganize and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Reorganize project structure automatically
      run: |
        mkdir -p app/src/main/java/com/aren/gridoverlay
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

        # انتقال کدهای جاوا
        [ -f GridOverlayService.java ] && mv GridOverlayService.java app/src/main/java/com/aren/gridoverlay/
        [ -f GridView.java ] && mv GridView.java app/src/main/java/com/aren/gridoverlay/
        [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/aren/gridoverlay/

        # انتقال منابع و مانیفست
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
        [ -f styles.xml ] && mv styles.xml app/src/main/res/values/

        # انتقال تنظیمات گریدل
        [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/
        [ -f gradle-properties ] && mv gradle-properties gradle.properties
        [ -f settings-gradle ] && mv settings-gradle settings.gradle
        [ -f "build gradle" ] && mv "build gradle" build.gradle

        # ایجاد خودکار app/build.gradle در صورت نبود
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.aren.gridoverlay'
            compileSdk 34

            defaultConfig {
                applicationId "com.aren.gridoverlay"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        chmod +x gradlew || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GridOverlay-AREN-APK
        path: app/build/outputs/apk/debug/*.apk
